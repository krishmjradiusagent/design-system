<!-- @dsCard group="Mel chat cards" height=360 subtitle="Reasoning trace running and done" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{position:relative;background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0;font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)}
.lab{margin:0;color:var(--text-secondary)}.sec{margin:var(--space-3) 0 0;color:var(--text-secondary)}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light" data-platform="ios"><p class="lab t-caption">Light</p>
<p class="sec t-caption">Running</p>
<div class="c-trace" data-running="true"><button type="button" class="c-trace__sum" aria-expanded="true"><span class="c-trace__spin" aria-hidden="true"></span><span class="c-trace__title">Finding quiet clients</span><i class="ph ph-caret-down c-trace__chev" aria-hidden="true"></i></button><div class="c-trace__steps"><div class="c-trace__line"><span class="c-trace__icon"><i class="ph ph-check"></i></span><span class="c-trace__text">Read 42 contacts</span></div><div class="c-trace__line" data-status="running"><span class="c-trace__icon"><span class="c-trace__spin"></span></span><span class="c-trace__text">Checking last replies</span></div></div></div>
<p class="sec t-caption">Done · collapsed</p>
<div class="c-trace"><button type="button" class="c-trace__sum" aria-expanded="false"><span class="c-trace__icon"><i class="ph ph-check"></i></span><span class="c-trace__title">Checked 2 things</span><i class="ph ph-caret-down c-trace__chev" aria-hidden="true"></i></button></div>
</div><div class="cell" data-theme="dark" data-platform="ios"><p class="lab t-caption">Dark</p>
<p class="sec t-caption">Running</p>
<div class="c-trace" data-running="true"><button type="button" class="c-trace__sum" aria-expanded="true"><span class="c-trace__spin" aria-hidden="true"></span><span class="c-trace__title">Finding quiet clients</span><i class="ph ph-caret-down c-trace__chev" aria-hidden="true"></i></button><div class="c-trace__steps"><div class="c-trace__line"><span class="c-trace__icon"><i class="ph ph-check"></i></span><span class="c-trace__text">Read 42 contacts</span></div><div class="c-trace__line" data-status="running"><span class="c-trace__icon"><span class="c-trace__spin"></span></span><span class="c-trace__text">Checking last replies</span></div></div></div>
<p class="sec t-caption">Done · collapsed</p>
<div class="c-trace"><button type="button" class="c-trace__sum" aria-expanded="false"><span class="c-trace__icon"><i class="ph ph-check"></i></span><span class="c-trace__title">Checked 2 things</span><i class="ph ph-caret-down c-trace__chev" aria-hidden="true"></i></button></div>
</div></div></body></html>
