<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}

.lab{margin:0;color:var(--text-secondary)}.sec{margin:var(--space-3) 0 0;color:var(--text-secondary)}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light" data-platform="ios"><p class="lab t-caption">Light</p><div class="c-prompt-rows"><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Find Jordan Lee</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Update Jordan’s preferences to 3 beds</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Draft a message to Jordan</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Remind me to call Jordan on Tuesday</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Start a check-in campaign for inactive clients</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Show my top buyers this month</span></button></div></div><div class="cell" data-theme="dark" data-platform="ios"><p class="lab t-caption">Dark</p><div class="c-prompt-rows"><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Find Jordan Lee</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Update Jordan’s preferences to 3 beds</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Draft a message to Jordan</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Remind me to call Jordan on Tuesday</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Start a check-in campaign for inactive clients</span></button><button type="button" class="c-prompt-row"><i class="ph ph-arrow-bend-down-right c-prompt-row__glyph" aria-hidden="true"></i><span class="c-prompt-row__text t-body-strong">Show my top buyers this month</span></button></div></div></div></body></html>
