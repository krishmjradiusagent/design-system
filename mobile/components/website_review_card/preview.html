<!-- @dsCard group="Mel chat cards" height=440 subtitle="Website preview with Copy link and Publish" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{position:relative;background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0;font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)}
.lab{margin:0;color:var(--text-secondary)}.sec{margin:var(--space-3) 0 0;color:var(--text-secondary)}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light" data-platform="ios"><p class="lab t-caption">Light</p>
<section class="m-draft" aria-label="Website to review"><div class="m-draft__head"><span class="rm-tile" aria-hidden="true"><i class="ph ph-globe" aria-hidden="true"></i></span><div><p class="t-body-strong">Property website</p><p class="t-meta t-secondary">1 page · public link</p></div><button type="button" class="rm-btn rm-btn--secondary rm-btn--sm t-meta m-copy"><i class="ph ph-copy" aria-hidden="true"></i><span>Copy link</span></button></div><div class="m-sep"></div>
<div class="m-rail m-rail--single" role="list"><div class="m-rail__item" role="listitem"><div class="m-ph"><i class="ph ph-image" aria-hidden="true"></i><button type="button" class="m-exp" aria-label="Open full screen"><i class="ph ph-arrows-out-simple" aria-hidden="true"></i></button></div><p class="t-meta">Listing website</p></div></div>
<div class="m-sep"></div><div class="m-draft__foot"><p class="t-meta t-secondary">Goes live as soon as you tap</p><button type="button" class="rm-btn rm-btn--primary rm-btn--sm t-meta"><span>Publish website</span></button></div></section>
</div><div class="cell" data-theme="dark" data-platform="ios"><p class="lab t-caption">Dark</p>
<section class="m-draft" aria-label="Website to review"><div class="m-draft__head"><span class="rm-tile" aria-hidden="true"><i class="ph ph-globe" aria-hidden="true"></i></span><div><p class="t-body-strong">Property website</p><p class="t-meta t-secondary">1 page · public link</p></div><button type="button" class="rm-btn rm-btn--secondary rm-btn--sm t-meta m-copy"><i class="ph ph-copy" aria-hidden="true"></i><span>Copy link</span></button></div><div class="m-sep"></div>
<div class="m-rail m-rail--single" role="list"><div class="m-rail__item" role="listitem"><div class="m-ph"><i class="ph ph-image" aria-hidden="true"></i><button type="button" class="m-exp" aria-label="Open full screen"><i class="ph ph-arrows-out-simple" aria-hidden="true"></i></button></div><p class="t-meta">Listing website</p></div></div>
<div class="m-sep"></div><div class="m-draft__foot"><p class="t-meta t-secondary">Goes live as soon as you tap</p><button type="button" class="rm-btn rm-btn--primary rm-btn--sm t-meta"><span>Publish website</span></button></div></section>
</div></div></body></html>
