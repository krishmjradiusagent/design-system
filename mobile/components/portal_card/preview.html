<!-- @dsCard group="Mel chat cards" height=200 subtitle="Portal link with Live dot and copy" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{position:relative;background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0;font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)}
.lab{margin:0;color:var(--text-secondary)}.sec{margin:var(--space-3) 0 0;color:var(--text-secondary)}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light" data-platform="ios"><p class="lab t-caption">Light</p>
<div class="cx-lc"><div class="cx-lc__thumb" role="img" aria-label="Portal preview"><i class="ph ph-house-line" aria-hidden="true"></i></div><div class="cx-lc__body"><div class="cx-lc__site t-meta"><span class="cx-lc__fav"><i class="ph ph-house" aria-hidden="true"></i></span><span>yourname.radiusagent.com</span><span class="cx-lc__live tone-success"><i></i>Live</span></div><a class="cx-lc__title t-body-strong" href="#">Your Client Portal Is Ready</a></div><button type="button" class="cx-lc__copy" aria-label="Copy link"><i class="ph ph-copy" aria-hidden="true"></i></button></div>
</div><div class="cell" data-theme="dark" data-platform="ios"><p class="lab t-caption">Dark</p>
<div class="cx-lc"><div class="cx-lc__thumb" role="img" aria-label="Portal preview"><i class="ph ph-house-line" aria-hidden="true"></i></div><div class="cx-lc__body"><div class="cx-lc__site t-meta"><span class="cx-lc__fav"><i class="ph ph-house" aria-hidden="true"></i></span><span>yourname.radiusagent.com</span><span class="cx-lc__live tone-success"><i></i>Live</span></div><a class="cx-lc__title t-body-strong" href="#">Your Client Portal Is Ready</a></div><button type="button" class="cx-lc__copy" aria-label="Copy link"><i class="ph ph-copy" aria-hidden="true"></i></button></div>
</div></div></body></html>
