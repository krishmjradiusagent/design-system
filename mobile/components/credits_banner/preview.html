<!-- @dsCard group="Mel chat cards" height=260 subtitle="Out of credits banner" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{position:relative;background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0;font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)}
.lab{margin:0;color:var(--text-secondary)}.sec{margin:var(--space-3) 0 0;color:var(--text-secondary)}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light" data-platform="ios"><p class="lab t-caption">Light</p>
<div class="m-credits" role="status"><div class="m-credits__h"><i class="ph ph-warning" aria-hidden="true"></i><div><p class="t-body-strong">You're out of credits</p><p class="t-meta">Mel can't create designs or send campaigns until your credits renew on Dec 1.</p></div></div>
<div class="m-meter"><i style="width:100%"></i></div>
<div class="m-credits__f"><span class="t-meta t-secondary">500 of 500 used · 0 left</span><button type="button" class="rm-btn rm-btn--secondary rm-btn--sm t-meta"><span>View billing</span></button></div></div>
</div><div class="cell" data-theme="dark" data-platform="ios"><p class="lab t-caption">Dark</p>
<div class="m-credits" role="status"><div class="m-credits__h"><i class="ph ph-warning" aria-hidden="true"></i><div><p class="t-body-strong">You're out of credits</p><p class="t-meta">Mel can't create designs or send campaigns until your credits renew on Dec 1.</p></div></div>
<div class="m-meter"><i style="width:100%"></i></div>
<div class="m-credits__f"><span class="t-meta t-secondary">500 of 500 used · 0 left</span><button type="button" class="rm-btn rm-btn--secondary rm-btn--sm t-meta"><span>View billing</span></button></div></div>
</div></div></body></html>
