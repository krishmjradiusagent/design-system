<!-- @dsCard group="Mel chat cards" height=220 subtitle="One-line send result" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{position:relative;background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0;font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)}
.lab{margin:0;color:var(--text-secondary)}.sec{margin:var(--space-3) 0 0;color:var(--text-secondary)}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light" data-platform="ios"><p class="lab t-caption">Light</p>
<div class="cx-done" role="status"><i class="ph ph-check-circle" aria-hidden="true"></i><span class="t-body-strong">Invites sent to 312 clients</span><span class="sq-tags"><span class="sq-ch rm-chip t-chip tone-sapphire"><i class="ph ph-envelope-simple" aria-hidden="true"></i>312</span><span class="sq-ch rm-chip t-chip tone-jade"><i class="ph ph-chat-circle" aria-hidden="true"></i>287</span></span></div>
<div class="cx-done cx-done--warn" role="status"><i class="ph ph-warning-circle" aria-hidden="true"></i><span class="t-body-strong">Sent to 304 of 312</span><span class="sq-tags"><span class="sq-ch rm-chip t-chip tone-danger">8 failed</span></span></div>
</div><div class="cell" data-theme="dark" data-platform="ios"><p class="lab t-caption">Dark</p>
<div class="cx-done" role="status"><i class="ph ph-check-circle" aria-hidden="true"></i><span class="t-body-strong">Invites sent to 312 clients</span><span class="sq-tags"><span class="sq-ch rm-chip t-chip tone-sapphire"><i class="ph ph-envelope-simple" aria-hidden="true"></i>312</span><span class="sq-ch rm-chip t-chip tone-jade"><i class="ph ph-chat-circle" aria-hidden="true"></i>287</span></span></div>
<div class="cx-done cx-done--warn" role="status"><i class="ph ph-warning-circle" aria-hidden="true"></i><span class="t-body-strong">Sent to 304 of 312</span><span class="sq-tags"><span class="sq-ch rm-chip t-chip tone-danger">8 failed</span></span></div>
</div></div></body></html>
