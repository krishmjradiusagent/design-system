<!-- @dsCard group="Mel chat cards" height=280 subtitle="Brand preview with colour and logo chips" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{position:relative;background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0;font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)}
.lab{margin:0;color:var(--text-secondary)}.sec{margin:var(--space-3) 0 0;color:var(--text-secondary)}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light" data-platform="ios"><p class="lab t-caption">Light</p>
<div class="rm-card rm-card--bordered m-bk" aria-label="Your brand"><div class="m-prev" style="background:#172B4D" role="img" aria-label="Brand preview"><div class="m-prev__top"><p class="m-prev__tag" style="color:#D4AF37">Just listed</p><span class="m-prev__logo"><i class="ph ph-image" aria-hidden="true"></i></span></div><div style="display:flex;flex-direction:column;gap:6px"><span class="m-prev__bar" style="background:#D4AF37"></span><p class="m-prev__addr">123 Ocean View Drive</p></div></div>
<div class="m-bchips"><label class="m-bchip"><span class="m-bchip__dot" style="background:#172B4D"></span><span class="t-meta">Primary</span><input type="color" value="#172B4D" aria-label="Primary colour"></label><label class="m-bchip"><span class="m-bchip__dot" style="background:#D4AF37"></span><span class="t-meta">Accent</span><input type="color" value="#D4AF37" aria-label="Accent colour"></label><button type="button" class="m-bchip"><i class="ph ph-upload-simple" aria-hidden="true"></i><span class="t-meta">Logo</span></button></div></div>
</div><div class="cell" data-theme="dark" data-platform="ios"><p class="lab t-caption">Dark</p>
<div class="rm-card rm-card--bordered m-bk" aria-label="Your brand"><div class="m-prev" style="background:#172B4D" role="img" aria-label="Brand preview"><div class="m-prev__top"><p class="m-prev__tag" style="color:#D4AF37">Just listed</p><span class="m-prev__logo"><i class="ph ph-image" aria-hidden="true"></i></span></div><div style="display:flex;flex-direction:column;gap:6px"><span class="m-prev__bar" style="background:#D4AF37"></span><p class="m-prev__addr">123 Ocean View Drive</p></div></div>
<div class="m-bchips"><label class="m-bchip"><span class="m-bchip__dot" style="background:#172B4D"></span><span class="t-meta">Primary</span><input type="color" value="#172B4D" aria-label="Primary colour"></label><label class="m-bchip"><span class="m-bchip__dot" style="background:#D4AF37"></span><span class="t-meta">Accent</span><input type="color" value="#D4AF37" aria-label="Accent colour"></label><button type="button" class="m-bchip"><i class="ph ph-upload-simple" aria-hidden="true"></i><span class="t-meta">Logo</span></button></div></div>
</div></div></body></html>
