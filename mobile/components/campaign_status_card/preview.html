<!-- @dsCard group="Mel chat cards" height=300 subtitle="Live campaign status" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{position:relative;background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0;font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)}
.lab{margin:0;color:var(--text-secondary)}.sec{margin:var(--space-3) 0 0;color:var(--text-secondary)}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light" data-platform="ios"><p class="lab t-caption">Light</p>
<section class="sq-card" aria-label="Campaign status"><div class="sq-head"><div><div class="t-body-strong">Buyer Engagement</div></div><span class="sq-status t-meta tone-success"><i></i>Live</span></div>
<div class="sq-kv sq-kv--ic"><div class="sq-kv__r"><span class="sq-kv__k"><span class="sq-ic tone-sapphire"><i class="ph ph-envelope-simple" aria-hidden="true"></i></span><span class="t-meta t-secondary">First email</span></span><span class="t-body-strong">Tomorrow, 9 AM</span></div><div class="sq-kv__r"><span class="sq-kv__k"><span class="sq-ic tone-iris"><i class="ph ph-users" aria-hidden="true"></i></span><span class="t-meta t-secondary">Recipients</span></span><span class="sq-tags"><span class="sq-ch rm-chip t-chip tone-sapphire"><i class="ph ph-envelope-simple" aria-hidden="true"></i>81</span><span class="sq-ch rm-chip t-chip tone-jade"><i class="ph ph-chat-circle" aria-hidden="true"></i>64</span></span></div></div></section>
</div><div class="cell" data-theme="dark" data-platform="ios"><p class="lab t-caption">Dark</p>
<section class="sq-card" aria-label="Campaign status"><div class="sq-head"><div><div class="t-body-strong">Buyer Engagement</div></div><span class="sq-status t-meta tone-success"><i></i>Live</span></div>
<div class="sq-kv sq-kv--ic"><div class="sq-kv__r"><span class="sq-kv__k"><span class="sq-ic tone-sapphire"><i class="ph ph-envelope-simple" aria-hidden="true"></i></span><span class="t-meta t-secondary">First email</span></span><span class="t-body-strong">Tomorrow, 9 AM</span></div><div class="sq-kv__r"><span class="sq-kv__k"><span class="sq-ic tone-iris"><i class="ph ph-users" aria-hidden="true"></i></span><span class="t-meta t-secondary">Recipients</span></span><span class="sq-tags"><span class="sq-ch rm-chip t-chip tone-sapphire"><i class="ph ph-envelope-simple" aria-hidden="true"></i>81</span><span class="sq-ch rm-chip t-chip tone-jade"><i class="ph ph-chat-circle" aria-hidden="true"></i>64</span></span></div></div></section>
</div></div></body></html>
