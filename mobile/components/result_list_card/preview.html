<!-- @dsCard group="Mel chat cards" height=330 subtitle="Per-person result rows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{position:relative;background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0;font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-3)}
.lab{margin:0;color:var(--text-secondary)}.sec{margin:var(--space-3) 0 0;color:var(--text-secondary)}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light" data-platform="ios"><p class="lab t-caption">Light</p>
<div class="rm-card rm-card--list m-rlist"><div class="rm-item"><span class="rm-tile" aria-hidden="true"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i></span><div class="rm-item__body"><div class="t-body-strong">Invites sent</div><div class="t-meta t-secondary">3 clients, email and text</div></div></div>
<div class="rm-item"><div class="rm-item__body"><div class="t-body-strong">Jordan Lee</div></div><span class="m-rst t-meta">Email and text sent</span></div><div class="rm-item"><div class="rm-item__body"><div class="t-body-strong">Priya Shah</div></div><span class="m-rst t-meta">Email and text sent</span></div><div class="rm-item"><div class="rm-item__body"><div class="t-body-strong">Marcus Reed</div></div><span class="m-rst t-meta" data-tone="warning">Email sent, no phone on file</span></div></div>
</div><div class="cell" data-theme="dark" data-platform="ios"><p class="lab t-caption">Dark</p>
<div class="rm-card rm-card--list m-rlist"><div class="rm-item"><span class="rm-tile" aria-hidden="true"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i></span><div class="rm-item__body"><div class="t-body-strong">Invites sent</div><div class="t-meta t-secondary">3 clients, email and text</div></div></div>
<div class="rm-item"><div class="rm-item__body"><div class="t-body-strong">Jordan Lee</div></div><span class="m-rst t-meta">Email and text sent</span></div><div class="rm-item"><div class="rm-item__body"><div class="t-body-strong">Priya Shah</div></div><span class="m-rst t-meta">Email and text sent</span></div><div class="rm-item"><div class="rm-item__body"><div class="t-body-strong">Marcus Reed</div></div><span class="m-rst t-meta" data-tone="warning">Email sent, no phone on file</span></div></div>
</div></div></body></html>
