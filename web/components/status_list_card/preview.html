<!-- @dsCard group="Mel chat cards" height=400 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div class="rds-mc rds-mc--lg rds-mc--list" data-state="partial">
 <div class="rds-mc__row rds-mc__row--head"><span class="rds-mc__t">3 of 5 destinations complete</span></div>
 <div class="rds-mc__row"><span class="rds-mc__tile"><i data-icon="image"></i></span><span class="rds-mc__ht"><span class="rds-mc__t">Instagram</span><span class="rds-mc__m">Published</span></span><span class="rds-tchip" data-tone="success">Published</span></div>
 <div class="rds-mc__row"><span class="rds-mc__tile"><i data-icon="message-square"></i></span><span class="rds-mc__ht"><span class="rds-mc__t">Facebook</span><span class="rds-mc__m">Published after status check</span></span><span class="rds-tchip" data-tone="success">Published</span></div>
 <div class="rds-mc__row"><span class="rds-mc__tile"><i data-icon="mail"></i></span><span class="rds-mc__ht"><span class="rds-mc__t">Email</span><span class="rds-mc__m">38 sent, 2 failed: invalid address</span></span><span class="rds-tchip" data-tone="warning">Partly sent</span></div>
 <div class="rds-mc__row"><span class="rds-mc__tile"><i data-icon="users"></i></span><span class="rds-mc__ht"><span class="rds-mc__t">LinkedIn</span><span class="rds-mc__m">Not connected, skipped</span></span><button type="button" class="rds-btn rds-act--secondary rds-btn--sm">Connect</button></div>
 <div class="rds-mc__row"><span class="rds-mc__tile"><i data-icon="play"></i></span><span class="rds-mc__ht"><span class="rds-mc__t">TikTok</span><span class="rds-mc__m">Authorization expired</span></span><button type="button" class="rds-btn rds-act--secondary rds-btn--sm">Reconnect</button></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
