<!-- @dsCard group="Feedback" height=330 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:10px;max-width:560px">
 <div class="rds-alert" role="status"><i data-icon="info"></i><div class="rds-alert__title">Mel is in review mode</div><div class="rds-alert__desc">Drafts wait for your OK before they send.</div></div>
 <div class="rds-alert rds-alert--success" role="status"><i data-icon="check-circle"></i><div class="rds-alert__title">Campaign enrolled</div><div class="rds-alert__desc">48 past clients will get the first email Monday at 9:00.</div></div>
 <div class="rds-alert rds-alert--warning" role="status"><i data-icon="alert-triangle"></i><div class="rds-alert__title">3 contacts have no email</div><div class="rds-alert__desc">Add one or Mel will skip them.</div></div>
 <div class="rds-alert rds-alert--danger" role="alert"><i data-icon="alert-circle"></i><div class="rds-alert__title">Send failed</div><div class="rds-alert__desc">Gmail disconnected. Reconnect to resend.</div></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
