<!-- @dsCard height=300 -->
<div class="cv">
<style>
.cv{position:relative;width:960px;height:300px;background:var(--mel-white);font-family:var(--font-sans);overflow:hidden}
.cv svg{position:absolute;left:0;top:0;width:960px;height:120px}
.cv .teal{fill:var(--mel-deep-teal)} .cv .green{fill:var(--mel-green)} .cv .mist{fill:var(--mel-mint-mist)} .cv .cloud{fill:var(--mel-cloud)} .cv .mint{fill:var(--mel-mint)} .cv .sky{fill:var(--mel-sky-mist)}
.cv .dotg{fill:var(--mel-deep-teal);fill-opacity:.12} .cv .dotm{fill:var(--mel-mint);fill-opacity:.24} .cv .white{fill:var(--mel-white)}
.cv .txt{position:absolute;left:40px;bottom:36px;max-width:900px}
.cv h1{margin:0;font-size:64px;line-height:.95;font-weight:400;letter-spacing:-0.03em;color:var(--mel-deep-teal);white-space:nowrap}
.cv p{margin:14px 0 0;font-size:14px;line-height:20px;color:var(--mel-slate);max-width:440px}
</style>
<svg viewBox="0 0 960 120" aria-hidden="true">
<!-- blocks: Deep Teal slab 384×120 (identity ink) · Mel Green Mel-shape 120×120 (the mark's silhouette, radius 40/11) · Mint Mist 216×120 · Cloud 144×120 · Sky Mist 96×120
     arrangement: one flush strip of unequal bands across the top, bleeding off top and right — the brand composes in calm horizontal bands
     pattern: the brand's own 12px dot grid (Brand · 04, "precise, technical") at 12% Deep Teal on Mint Mist + Cloud, 24% Mint on Deep Teal; the living white dot sits in the Mel shape
     scales: space-3 (12px) pitch, 1.4px dots, shape radii 40/11 from the mark, band widths in multiples of space-6 (24px) -->
<defs>
 <pattern id="dg" width="12" height="12" patternUnits="userSpaceOnUse"><circle class="dotg" cx="6" cy="6" r="1.4"/></pattern>
 <pattern id="dm" width="12" height="12" patternUnits="userSpaceOnUse"><circle class="dotm" cx="6" cy="6" r="1.4"/></pattern>
</defs>
<rect class="teal" x="0" y="0" width="384" height="120"/>
<rect x="216" y="0" width="168" height="120" fill="url(#dm)"/>
<path class="green" transform="translate(384 0)" d="M40 0 H80 A40 40 0 0 1 120 40 V80 A40 40 0 0 1 80 120 H11 A11 11 0 0 1 0 109 V40 A40 40 0 0 1 40 0 Z"/>
<circle class="white" cx="444" cy="60" r="13"/>
<rect class="mist" x="504" y="0" width="216" height="120"/>
<rect x="504" y="0" width="216" height="120" fill="url(#dg)"/>
<rect class="cloud" x="720" y="0" width="144" height="120"/>
<rect x="720" y="0" width="144" height="120" fill="url(#dg)"/>
<rect class="sky" x="864" y="0" width="96" height="120"/>
<circle class="mint" cx="912" cy="60" r="12"/>
</svg>
<div class="txt"><h1>Radius UI Design System</h1><p>Mel brand on shadcn foundations: Mona Sans, Deep Teal and Mel Green, for every Radius and Mel surface.</p></div>
</div>
<script>void 0;</script>
