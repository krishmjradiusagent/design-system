<!-- @dsCard group="Mel chat cards" height=330 width=1000 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start">
 <button type="button" class="rds-pkg" data-rds-press aria-pressed="false" aria-label="Open all 12 Instagram pieces in the side panel">
  <span class="rds-pkg__top"><span class="rds-mc__tile"><i data-icon="image"></i></span><div><p class="ui-body" style="font-weight:600">Instagram · 12 pieces</p><p class="rds-mc__m">6 feed posts, 4 stories, 2 reels</p></div><span class="rds-pkg__fs"><i data-icon="maximize-2"></i></span></span>
  <span class="rds-pkg__strip"><span class="rds-ph" data-tone="dusk"><i data-icon="image"></i></span><span class="rds-ph" data-tone="sand"><i data-icon="image"></i></span><span class="rds-ph"><i data-icon="image"></i></span><span class="rds-ph" data-tone="teal"><i data-icon="image"></i><span class="rds-pkg__more">+9</span></span></span>
 </button>
 <button type="button" class="rds-pkg" data-rds-press aria-pressed="true" aria-label="Listing marketing package">
  <span class="rds-pkg__top"><span class="rds-mc__tile"><i data-icon="design"></i></span><div><p class="ui-body" style="font-weight:600">Listing marketing package</p><p class="rds-mc__m">123 Ocean View Drive · 6 designs</p></div><span class="rds-pkg__fs"><i data-icon="maximize-2"></i></span></span>
  <span class="rds-pkg__strip rds-pkg__strip--big"><span class="rds-ph" data-tone="sand"><i data-icon="image"></i></span><span class="rds-ph" data-tone="dusk"><i data-icon="image"></i></span><span class="rds-ph" data-tone="teal"><i data-icon="image"></i><span class="rds-pkg__more">+3</span></span></span>
 </button>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
