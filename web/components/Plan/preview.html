<!-- @dsCard group="Agentic chat" height=360 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div class="rds-plan" style="max-width:560px">
 <div class="rds-plan__head"><span class="rds-icon-tile" data-glyph="campaigns" style="width:36px;height:36px"></span><div><h3 class="rds-plan__title">Open-house follow-up</h3><p class="rds-plan__desc">4 steps · about 2 minutes · nothing sends without your OK</p></div></div>
 <div class="rds-plan__body"><div class="rds-task">
  <div class="rds-task__row"><span class="rds-task__check"></span><span class="rds-task__label">Match 14 visitors to your CRM</span></div>
  <div class="rds-task__row"><span class="rds-task__check"></span><span class="rds-task__label">Draft a thank-you for each</span></div>
  <div class="rds-task__row"><span class="rds-task__check"></span><span class="rds-task__label">Text the 3 with no email</span></div>
  <div class="rds-task__row"><span class="rds-task__check"></span><span class="rds-task__label">Add all to the "Open house" campaign</span></div>
 </div></div>
 <div class="rds-plan__foot"><button class="rds-btn rds-btn--ghost rds-btn--sm">Edit plan</button><button class="rds-btn rds-btn--primary rds-btn--sm">Run plan</button></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
