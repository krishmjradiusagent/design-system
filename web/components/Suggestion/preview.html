<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div class="rds-chat-scope" style="display:flex;flex-direction:column;gap:20px;max-width:720px">
 <div class="rds-suggestions"><button class="rds-suggestion">Make the caption shorter</button><button class="rds-suggestion">Add the open house time</button><button class="rds-suggestion" data-prompt="Post it to Instagram at 9:00 tomorrow">Post it tomorrow morning</button></div>
 <div class="rds-suggestions rds-suggestions--wrap" style="margin-left:0"><button class="rds-suggestion rds-suggestion--chip">Write a listing description</button><button class="rds-suggestion rds-suggestion--chip">Price a home</button><button class="rds-suggestion rds-suggestion--chip">Plan my week</button></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
