<!-- @dsCard group="Data display" height=320 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div class="rds-card" style="max-width:620px"><div class="rds-card__header"><h3 class="rds-card__title">Replies by channel</h3><p class="rds-card__desc">Last 6 weeks</p></div><div class="rds-card__content rds-chart">
 <svg viewBox="0 0 560 170" role="img" aria-label="Bar chart of replies by channel">
  <g><line class="grid" x1="30" x2="560" y1="20" y2="20"/><line class="grid" x1="30" x2="560" y1="70" y2="70"/><line class="grid" x1="30" x2="560" y1="120" y2="120"/></g>
  <g class="axis"><text x="0" y="24">60</text><text x="0" y="74">30</text><text x="6" y="124">0</text></g>
  <g>
   <rect x="50" y="60" width="26" height="60" rx="4" fill="var(--chart-2)"/><rect x="80" y="84" width="26" height="36" rx="4" fill="var(--chart-1)"/>
   <rect x="140" y="44" width="26" height="76" rx="4" fill="var(--chart-2)"/><rect x="170" y="80" width="26" height="40" rx="4" fill="var(--chart-1)"/>
   <rect x="230" y="50" width="26" height="70" rx="4" fill="var(--chart-2)"/><rect x="260" y="70" width="26" height="50" rx="4" fill="var(--chart-1)"/>
   <rect x="320" y="34" width="26" height="86" rx="4" fill="var(--chart-2)"/><rect x="350" y="66" width="26" height="54" rx="4" fill="var(--chart-1)"/>
   <rect x="410" y="28" width="26" height="92" rx="4" fill="var(--chart-2)"/><rect x="440" y="62" width="26" height="58" rx="4" fill="var(--chart-1)"/>
   <rect x="500" y="22" width="26" height="98" rx="4" fill="var(--chart-2)"/><rect x="530" y="58" width="26" height="62" rx="4" fill="var(--chart-1)"/>
  </g>
  <g class="axis"><text x="64" y="140">W1</text><text x="154" y="140">W2</text><text x="244" y="140">W3</text><text x="334" y="140">W4</text><text x="424" y="140">W5</text><text x="514" y="140">W6</text></g>
 </svg>
 <div class="rds-chart__legend"><span><i style="background:var(--chart-2)"></i>Email</span><span><i style="background:var(--chart-1)"></i>Text</span></div>
</div></div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
