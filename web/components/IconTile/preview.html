<!-- @dsCard group="Mel identity" height=230 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:10px;text-align:center">
 <div><span class="rds-icon-tile" data-glyph="campaigns" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Campaigns</div></div>
 <div><span class="rds-icon-tile" data-glyph="design" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Design</div></div>
 <div><span class="rds-icon-tile" data-glyph="crm" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">CRM</div></div>
 <div><span class="rds-icon-tile" data-glyph="client-experience" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Client exp.</div></div>
 <div><span class="rds-icon-tile" data-glyph="documentation" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Docs</div></div>
 <div><span class="rds-icon-tile" data-glyph="compliance" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Compliance</div></div>
 <div><span class="rds-icon-tile" data-glyph="commissions" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Commissions</div></div>
 <div><span class="rds-icon-tile" data-glyph="calendar" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Calendar</div></div>
 <div><span class="rds-icon-tile" data-glyph="voice" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Voice</div></div>
 <div><span class="rds-icon-tile" data-glyph="working" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Working</div></div>
 <div><span class="rds-icon-tile" data-glyph="ask" style="width:56px;height:56px"></span><div class="ui-caption rds-muted">Ask Mel</div></div>
</div>
<div style="display:flex;gap:10px;margin-top:18px;padding:14px;background:var(--mel-deep-teal);border-radius:var(--radius-xl)"><span class="rds-icon-tile rds-icon-tile--dark" data-glyph="campaigns"></span><span class="rds-icon-tile rds-icon-tile--dark" data-glyph="crm"></span><span class="rds-icon-tile rds-icon-tile--dark" data-glyph="calendar"></span><span class="rds-icon-tile rds-icon-tile--dark" data-glyph="ask"></span></div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
