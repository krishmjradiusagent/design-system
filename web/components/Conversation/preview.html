<!-- @dsCard group="Agentic chat" height=520 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div class="rds-chat-scope" style="height:470px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius-3xl);overflow:hidden">
 <div class="rds-conversation"><div class="rds-conversation__col">
  <div class="rds-msg rds-msg--user"><div class="rds-msg__content">Make a just-listed post for 12 Oak St</div></div>
  <div class="rds-msg rds-msg--assistant"><div class="rds-msg__content"><p>Done. I made three posts in your brand colours. The first leads with the kitchen, the others with the yard and the price.</p></div></div>
  <div class="rds-artifact"><div class="rds-artifact__head"><span class="rds-assistant-pill" data-assistant="coral"><span class="rds-mel-mark" data-assistant="coral" data-state="ready" data-still></span>Marketing Design</span><b>3 posts</b><span>· 12 Oak St</span></div><div class="rds-artifact__pieces"><div class="rds-artifact__piece"><div class="rds-artifact__thumb" style="aspect-ratio:1">Post 1</div></div><div class="rds-artifact__piece"><div class="rds-artifact__thumb" style="aspect-ratio:1">Post 2</div></div><div class="rds-artifact__piece"><div class="rds-artifact__thumb" style="aspect-ratio:1">Post 3</div></div></div></div>
  <div class="rds-suggestions"><button class="rds-suggestion">Make the caption shorter</button><button class="rds-suggestion">Add the open house time</button></div>
 </div></div>
 <div class="rds-dock"><div class="rds-prompt">
 <textarea class="rds-prompt__field" rows="1" placeholder="Ask Mel anything" aria-label="Message Mel"></textarea>
 <div class="rds-prompt__toolbar">
  <div class="rds-prompt__tools"><button class="rds-iconbtn" aria-label="Attach"><i data-icon="plus"></i></button><button class="rds-prompt__model">Marketing Design <i data-icon="chevron-down" class="rds-ic--sm"></i></button></div>
  <div class="rds-prompt__right"><button class="rds-iconbtn" aria-label="Dictate"><i data-icon="mic"></i></button><button class="rds-prompt__submit" aria-label="Talk to Mel"><i data-icon="send"></i></button></div>
 </div></div></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
