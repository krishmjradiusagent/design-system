<!-- @dsCard group="Forms" height=150 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:14px">
 <div class="rds-otp" aria-label="Verification code"><div class="rds-otp__group"><input class="rds-otp__slot" maxlength="1" value="4" aria-label="Digit 1"><input class="rds-otp__slot" maxlength="1" value="8" aria-label="Digit 2"><input class="rds-otp__slot" maxlength="1" value="2" aria-label="Digit 3"></div><span class="rds-otp__sep">–</span><div class="rds-otp__group"><input class="rds-otp__slot" maxlength="1" aria-label="Digit 4"><input class="rds-otp__slot" maxlength="1" aria-label="Digit 5"><input class="rds-otp__slot" maxlength="1" aria-label="Digit 6"></div></div>
 <div class="rds-otp rds-otp--error"><div class="rds-otp__group"><input class="rds-otp__slot" maxlength="1" value="1" aria-label="Digit 1"><input class="rds-otp__slot" maxlength="1" value="1" aria-label="Digit 2"><input class="rds-otp__slot" maxlength="1" value="9" aria-label="Digit 3"><input class="rds-otp__slot" maxlength="1" value="0" aria-label="Digit 4"></div><span class="rds-field__error">That code didn't match. Try again.</span></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
