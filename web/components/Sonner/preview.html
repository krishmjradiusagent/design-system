<!-- @dsCard group="Feedback" height=260 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div class="rds-toaster rds-toaster--inline" style="align-items:flex-start">
 <div class="rds-toast rds-toast--success" role="status"><i data-icon="check-circle"></i><div class="rds-toast__body"><div class="rds-toast__title">Draft sent to Jordan</div><div class="rds-toast__desc">Mel will follow up in 3 days if there's no reply.</div></div><button class="rds-btn rds-btn--outline rds-btn--sm">Undo</button></div>
 <div class="rds-toast rds-toast--dark" role="status"><i data-icon="sparkles"></i><div class="rds-toast__body"><div class="rds-toast__title">Mel finished 3 posts</div><div class="rds-toast__desc">Ready for review in Marketing.</div></div><button class="rds-iconbtn" aria-label="Dismiss" data-rds-dismiss style="color:var(--mel-on-dark-text)"><i data-icon="x"></i></button></div>
</div>
<button class="rds-btn rds-btn--outline rds-btn--sm" style="margin-top:12px" data-rds-toast="Settings saved" data-variant="success">Trigger a toast</button>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
