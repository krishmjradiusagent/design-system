<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start">
 <div><p class="ui-caption rds-muted" style="margin:0 0 8px">Review · “Save it?”</p>
  <div class="rds-mc rds-mc--md"><p class="rds-mc__t">Jordan Lee · preferences</p>
   <div class="rds-mc__kv rds-mc__kv--3"><div><span class="rds-mc__m">Beds</span><span class="rds-mc__b"><s>2</s> → 3</span></div><div><span class="rds-mc__m">Area</span><span class="rds-mc__b">Oak Street · no change</span></div><div><span class="rds-mc__m">Budget</span><span class="rds-mc__b">Under [PRICE] · no change</span></div></div></div></div>
 <div><p class="ui-caption rds-muted" style="margin:0 0 8px">Saved</p>
  <div class="rds-mc rds-mc--md"><p class="rds-mc__t">Jordan Lee · status</p>
   <div class="rds-mc__kv"><div><span class="rds-mc__m">Stage</span><span class="rds-mc__b"><s>Nurture</s> → Active</span></div><div><span class="rds-mc__m">Updated</span><span class="rds-mc__b">Just now</span></div></div></div>
  <p class="rds-mstatus" style="margin-top:10px"><span class="rds-mstatus__dot"></span>Saved to Radius CRM</p></div>
</div>
</div>
