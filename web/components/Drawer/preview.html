<!-- @dsCard group="Overlays" height=380 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="position:relative;height:340px;border-radius:var(--radius-xl);overflow:hidden;border:1px solid var(--border);background:var(--mel-cloud);max-width:390px;margin:0 auto">
 <div class="rds-overlay rds-overlay--inline" data-open style="padding:0">
  <div class="rds-drawer" role="dialog" aria-modal="true" aria-labelledby="drt">
   <div class="rds-drawer__handle"></div>
   <div class="rds-dialog__header"><h2 class="rds-dialog__title" id="drt">Share draft</h2><p class="rds-dialog__desc">Pick where Mel posts it.</p></div>
   <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="rds-pill" aria-pressed="true">Instagram</button><button class="rds-pill" aria-pressed="false">Facebook</button><button class="rds-pill" aria-pressed="false">Email</button></div>
   <button class="rds-btn rds-btn--primary rds-btn--lg" style="width:100%">Post now</button>
  </div>
 </div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
