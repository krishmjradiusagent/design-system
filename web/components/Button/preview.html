<!-- @dsCard group="Actions" height=300 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:16px">
 <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
  <button class="rds-btn rds-btn--primary">Start free trial</button>
  <button class="rds-btn rds-btn--brand"><i data-icon="sparkles"></i> Ask Mel</button>
  <button class="rds-btn rds-btn--outline">Book a demo</button>
  <button class="rds-btn rds-btn--secondary">Save draft</button>
  <button class="rds-btn rds-btn--ghost">Cancel</button>
  <button class="rds-btn rds-btn--link">Learn more <i data-icon="arrow-right"></i></button>
  <button class="rds-btn rds-btn--destructive"><i data-icon="trash"></i> Delete</button>
 </div>
 <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
  <button class="rds-btn rds-btn--primary rds-btn--sm">Review</button>
  <button class="rds-btn rds-btn--primary">Send to client</button>
  <button class="rds-btn rds-btn--primary rds-btn--lg"><i data-icon="plus"></i> New chat</button>
  <button class="rds-btn rds-btn--primary rds-btn--xl rds-btn--lift">Start free trial</button>
  <button class="rds-btn rds-btn--strong rds-btn--2xl">Book a demo</button>
 </div>
 <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
  <button class="rds-btn rds-btn--primary rds-btn--icon" aria-label="Send"><i data-icon="arrow-up"></i></button>
  <button class="rds-btn rds-btn--outline rds-btn--icon rds-btn--sm" aria-label="More"><i data-icon="more-horizontal"></i></button>
  <button class="rds-btn rds-btn--primary" disabled>Disabled</button>
  <button class="rds-btn rds-btn--primary" aria-busy="true"><span class="rds-spinner"></span> Sending</button>
  <span style="padding:10px 14px;border-radius:999px;background:var(--mel-deep-teal);display:inline-flex;gap:8px"><button class="rds-btn rds-btn--on-dark">Learn more</button><button class="rds-btn rds-btn--brand">Ask Mel</button></span>
 </div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
