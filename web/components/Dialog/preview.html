<!-- @dsCard group="Overlays" height=400 -->
<div class="rds" style="padding:0px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="position:relative;height:350px;border-radius:var(--radius-xl);overflow:hidden;border:1px solid var(--border);background:var(--mel-cloud)">
 <div class="rds-overlay rds-overlay--inline" data-open id="dlg1">
  <div class="rds-dialog rds-dialog--static" role="dialog" aria-modal="true" aria-labelledby="dt1">
   <button class="rds-iconbtn rds-dialog__close" data-rds-close aria-label="Close"><i data-icon="x"></i></button>
   <div class="rds-dialog__header"><h2 class="rds-dialog__title" id="dt1">Send to client</h2><p class="rds-dialog__desc">Mel will email the flyer and follow up in 3 days.</p></div>
   <div class="rds-field"><label class="rds-label" for="dto">To</label><input id="dto" class="rds-input" value="jordan@email.com"></div>
   <div class="rds-dialog__footer"><button class="rds-btn rds-btn--ghost" data-rds-close>Cancel</button><button class="rds-btn rds-btn--primary">Send</button></div>
  </div>
 </div>
 <div style="position:absolute;left:16px;top:16px"><button class="rds-btn rds-btn--outline rds-btn--sm" data-rds-open="#dlg1">Open dialog</button></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
