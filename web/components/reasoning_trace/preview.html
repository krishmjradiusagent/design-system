<!-- @dsCard group="Mel chat core" height=560 width=1100 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px">
 <div><p class="ui-caption rds-muted" style="margin:0 0 8px">state: working · open</p>
  <div class="rds-trace" data-running><button type="button" class="rds-trace__sum" aria-expanded="true"><span class="rds-trace__icon"><span class="rds-spin"></span></span><span class="rds-trace__title">Checking your CRM</span><i data-icon="chevron-down" class="rds-trace__chev"></i></button>
   <div class="rds-trace__steps"><div class="rds-trace__line" data-status="done"><span class="rds-trace__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.2l1.9 1.9 3.8-4"/></svg></span><span class="rds-trace__text">Checked your CRM · 0 contacts</span></div><div class="rds-trace__line" data-status="running"><span class="rds-trace__icon"><span class="rds-spin"></span></span><span class="rds-trace__text">Checking connected tools</span></div></div></div></div>
 <div><p class="ui-caption rds-muted" style="margin:0 0 8px">state: done · collapsed (tap to reopen)</p>
  <div class="rds-trace"><button type="button" class="rds-trace__sum" aria-expanded="false"><span class="rds-trace__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.2l1.9 1.9 3.8-4"/></svg></span><span class="rds-trace__title">Checked 2 things</span><i data-icon="chevron-down" class="rds-trace__chev"></i></button>
   <div class="rds-trace__steps"><div class="rds-trace__line" data-status="done"><span class="rds-trace__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.2l1.9 1.9 3.8-4"/></svg></span><span class="rds-trace__text">Checked your CRM · 0 contacts</span></div><div class="rds-trace__line" data-status="done"><span class="rds-trace__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.2l1.9 1.9 3.8-4"/></svg></span><span class="rds-trace__text">Checked connected tools · none</span></div></div></div></div>
</div>
<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
 <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><p class="ui-caption rds-muted" style="margin:0">Live sequence, Mel web timings (loops)</p><button type="button" class="rds-btn rds-btn--outline rds-btn--sm" data-rds-replay><i data-icon="refresh-cw"></i> Replay</button></div>
 <div data-rds-trace-live data-loop style="max-width:720px;min-height:250px" data-ask="Set a follow-up with Jordan Lee for Tuesday" data-steps="Reading Jordan's activity|Checking your calendar|Drafting the reminder" data-summary="Checked 3 things" data-reply="Done. I can add a call with Jordan Lee on Tue, Oct 27 at 10:00 AM with a reminder 15 minutes before. Add it to your calendar?" data-rows="Add it|Pick another time|Draft a text instead"></div>
</div>
</div>
