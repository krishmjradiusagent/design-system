<!-- @dsCard group="Overlays" height=420 -->
<div class="rds" style="padding:0px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="position:relative;height:380px;border-radius:var(--radius-xl);overflow:hidden;border:1px solid var(--border);background:var(--mel-cloud)">
 <div class="rds-overlay rds-overlay--inline" data-open style="padding:0">
  <aside class="rds-sheet" role="dialog" aria-modal="true" aria-labelledby="st1">
   <div class="rds-sheet__header"><h2 class="rds-dialog__title" id="st1">Jordan Reyes</h2><p class="rds-dialog__desc">Buyer · Pre-approved $1.3M</p></div>
   <div class="rds-sheet__body"><div class="rds-field"><label class="rds-label" for="sn">Note</label><textarea id="sn" class="rds-textarea">Wants a yard, close to Lincoln Elementary.</textarea></div><label class="rds-field rds-field--row" style="justify-content:space-between"><span class="rds-label">Let Mel follow up</span><input type="checkbox" role="switch" class="rds-switch" checked></label></div>
   <div class="rds-sheet__footer"><button class="rds-btn rds-btn--ghost" data-rds-close>Cancel</button><button class="rds-btn rds-btn--primary">Save</button></div>
  </aside>
 </div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
