<!-- @dsCard group="Mel identity" height=220 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
 <div class="rds-dots-bg" style="height:170px;border:1px solid var(--border);border-radius:var(--radius-3xl);display:flex;align-items:flex-end;padding:18px" ><span class="ui-h4">White</span></div>
 <div class="rds-dots-bg" style="height:170px;background-color:var(--mel-cloud);border-radius:var(--radius-3xl);display:flex;align-items:flex-end;padding:18px"><span class="ui-h4">Cloud</span></div>
 <div style="height:170px;background-color:var(--mel-deep-teal);background-image:radial-gradient(circle, rgba(61,220,151,0.24) 1.4px, rgba(0,0,0,0) 1.6px);background-size:12px 12px;border-radius:var(--radius-3xl);display:flex;align-items:flex-end;padding:18px;color:var(--mel-white)"><span class="ui-h4">Deep Teal</span></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
