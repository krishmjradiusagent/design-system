<!-- @dsCard group="Agentic chat" height=330 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div class="rds-chat-scope" style="display:flex;flex-direction:column;gap:16px;max-width:720px">
 <div class="rds-prompt">
 <textarea class="rds-prompt__field" rows="1" placeholder="Ask Mel anything" aria-label="Message Mel"></textarea>
 <div class="rds-prompt__toolbar">
  <div class="rds-prompt__tools"><button class="rds-iconbtn" aria-label="Attach"><i data-icon="plus"></i></button><button class="rds-prompt__model">Marketing Design <i data-icon="chevron-down" class="rds-ic--sm"></i></button></div>
  <div class="rds-prompt__right"><button class="rds-iconbtn" aria-label="Dictate"><i data-icon="mic"></i></button><button class="rds-prompt__submit" aria-label="Talk to Mel"><i data-icon="send"></i></button></div>
 </div></div>
 <div class="rds-prompt">
  <div class="rds-prompt__attachments"><span class="rds-attachment"><span class="rds-attachment__thumb"><i data-icon="image" class="rds-ic--sm"></i></span><span><span class="rds-attachment__name">kitchen.jpg</span><br><span class="rds-attachment__meta">2.1 MB</span></span><button class="rds-iconbtn" data-rds-dismiss aria-label="Remove"><i data-icon="x" class="rds-ic--sm"></i></button></span></div>
  <textarea class="rds-prompt__field" rows="1" aria-label="Message Mel">Use this photo as the cover</textarea>
  <div class="rds-prompt__toolbar"><div class="rds-prompt__tools"><button class="rds-iconbtn" aria-label="Attach"><i data-icon="plus"></i></button><span class="rds-context" style="--pct:62"><span class="rds-context__ring"></span>62%</span></div><div class="rds-prompt__right"><button class="rds-prompt__submit" aria-label="Send"><i data-icon="arrow-up"></i></button></div></div>
 </div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
