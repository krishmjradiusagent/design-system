<!-- @dsCard group="Agentic chat" height=330 -->
<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:12px;max-width:560px">
 <div class="rds-confirm"><div class="rds-confirm__head"><span class="rds-mel-mark" data-state="attention" style="width:28px;height:28px"></span><div><p class="rds-confirm__title">Send 14 emails from jordan@radiusagent.com?</p><p class="rds-confirm__desc">Each visitor gets a personal thank-you. You can undo for 30 seconds.</p></div></div>
  <div class="rds-confirm__actions"><button class="rds-btn rds-btn--primary rds-btn--sm" data-rds-confirm="approved">Send 14 emails</button><button class="rds-btn rds-btn--outline rds-btn--sm">Review first</button><button class="rds-btn rds-btn--ghost rds-btn--sm" data-rds-confirm="rejected">Don't send</button></div></div>
 <div class="rds-confirm" data-state="approved"><div class="rds-confirm__head"><span class="rds-mel-mark" data-state="done" style="width:28px;height:28px"></span><div><p class="rds-confirm__title">14 emails sent</p><p class="rds-confirm__desc">Mel will follow up in 3 days if there's no reply.</p></div></div></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
