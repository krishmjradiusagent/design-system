<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:16px;max-width:560px;padding:20px 0">
 <div class="rds-ask"><span class="rds-mel-mark" data-state="ready" style="width:26px;height:26px"></span><input placeholder="Ask Mel to follow up with a lead" aria-label="Ask Mel"><button class="rds-ask__send" aria-label="Send"><i data-icon="arrow-up"></i></button></div>
 <div class="rds-skill-pills"><button class="rds-skill-pill"><span class="rds-mel-mark" data-assistant="coral" data-still></span>Make a post</button><button class="rds-skill-pill"><span class="rds-mel-mark" data-assistant="lagoon" data-still></span>Find a client</button><button class="rds-skill-pill"><span class="rds-mel-mark" data-assistant="honey" data-still></span>Start a campaign</button></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
