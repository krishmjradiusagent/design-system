<div class="rds" style="padding:24px;background:var(--background);min-height:100%;box-sizing:border-box">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
 <div style="display:flex;align-items:center;justify-content:center;height:160px;border:1px solid var(--border);border-radius:var(--radius-2xl)"><span class="rds-mel-lockup"><span class="rds-mel-mark" data-state="ready" style="width:44px;height:44px"></span><span class="rds-mel-lockup__word" style="font-size:44px">mel</span></span></div>
 <div style="display:flex;align-items:center;justify-content:center;height:160px;border-radius:var(--radius-2xl);background:var(--mel-deep-teal)"><span class="rds-mel-lockup rds-mel-lockup--on-dark"><span class="rds-mel-mark" data-state="ready" style="width:44px;height:44px"></span><span class="rds-mel-lockup__word" style="font-size:44px">mel</span></span></div>
 <div style="display:flex;align-items:center;justify-content:center;height:160px;border-radius:var(--radius-2xl);background:var(--gradient-morning)"><span class="rds-mel-lockup"><span class="rds-mel-mark" data-state="ready" style="width:44px;height:44px"></span><span class="rds-mel-lockup__word" style="font-size:44px">mel</span></span></div>
</div>
</div>
<script>window.RadiusUI && RadiusUI.init(document.body);</script>
